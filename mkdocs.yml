site_name: Request a military service record documentation
repo_url: https://github.com/nationalarchives/flask-application-template
theme:
  name: material
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Business rules:
      - Closed records: business-rules/closed-records.md
      - Birth years covered: business-rules/birth-years-covered.md
  - Core patterns:
      - State machine: core-patterns/state-machine.md
      - Date of birth rules: core-patterns/date-of-birth-rules.md
      - Post-Redirect-Get: core-patterns/post-redirect-get.md
      - Content approach: core-patterns/content-approach.md
      - Hyperlinks: core-patterns/hyperlinks.md
      - Template approach: core-patterns/template-approach.md
      - Back links: core-patterns/back-links.md
  - Testing:
      - Overview: testing/index.md
      - Playwright: testing/playwright.md
      - Unused content: testing/unused-content.md
      - Navigation helpers: testing/navigation-helpers.md
