services:
  app:
    build:
      context: .
      args:
        IMAGE: ghcr.io/nationalarchives/tna-python-dev
        IMAGE_TAG: preview
    environment:
      - ENVIRONMENT_NAME=${ENVIRONMENT_NAME:-localhost}
      - CONFIG=${CONFIG:-config.Develop}
      - BUILD_VERSION=local
      - DEBUG=true
      - SECRET_KEY=abc123
      - NPM_DEVELOP_COMMAND=dev
      - COOKIE_DOMAIN=localhost
      - CSP_STYLE_SRC=p.typekit.net,use.typekit.net
      - CSP_FONT_SRC=use.typekit.net
      - SESSION_REDIS_URL=redis://redis:6379/0
      - SQLALCHEMY_DATABASE_URI=postgresql://postgres:postgres@db:5432/postgres
      - CACHE_TYPE=RedisCache
      - CACHE_REDIS_URL=redis://redis:6379/1
      - GA4_ID=GTM-T8DSWV
      - SESSION_COOKIE_SECURE=False
      - MOCK_S3=${MOCK_S3:-True}
      - MOCK_S3_ENDPOINT_URL=http://mock-s3:9000
      - MOCK_S3_ACCESS_KEY_ID=minioadmin
      - MOCK_S3_SECRET_ACCESS_KEY=minioadmin
      - PROOF_OF_DEATH_BUCKET_NAME=${PROOF_OF_DEATH_BUCKET_NAME:-proof-of-death}
    env_file:
      - path: .env
        required: false
    ports:
      - 65517:8080
    volumes:
      - ./:/app
      - ~/.aws:/home/app/.aws
    depends_on:
      - db
      - redis
      - mock-record-copying-service-api
      - mock-s3
      - mock-s3-init
    healthcheck:
      start_period: 10s
      start_interval: 2s

  db:
    image: postgres:16.0
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    ports:
      - 65502:8080

  mock-record-copying-service-api:
    image: wiremock/wiremock:3.13.2
    volumes:
      - ./wiremock:/home/wiremock
    ports:
      - 65498:8080

  mock-s3:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - 65504:9001
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      start_period: 5s
      interval: 5s
      retries: 5

  mock-s3-init:
    image: minio/mc:latest
    depends_on:
      mock-s3:
        condition: service_healthy
    environment:
      - PROOF_OF_DEATH_BUCKET_NAME=${PROOF_OF_DEATH_BUCKET_NAME:-proof-of-death}
      - MOCK_S3_ACCESS_KEY_ID=minioadmin
      - MOCK_S3_SECRET_ACCESS_KEY=minioadmin
    entrypoint: >
      /bin/sh -c "
      mc alias set mock-s3 http://mock-s3:9000 \"$$MOCK_S3_ACCESS_KEY_ID\" \"$$MOCK_S3_SECRET_ACCESS_KEY\" &&
      mc mb --ignore-existing mock-s3/\"$$PROOF_OF_DEATH_BUCKET_NAME\"
      "

  docs:
    image: squidfunk/mkdocs-material
    volumes:
      - .:/docs
    ports:
      - 65518:8000

  redis:
    image: redis:latest
    volumes:
      - redis:/data

volumes:
  redis:
  pgdata:
  miniodata:
