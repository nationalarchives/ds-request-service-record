services:
  app:
    build:
      context: .
      args:
        IMAGE: ghcr.io/nationalarchives/tna-python-dev
        IMAGE_TAG: preview
    environment:
      - ENVIRONMENT_NAME=${ENVIRONMENT_NAME:-localhost}
      - CONFIG=${CONFIG:-config.Develop}
      - BUILD_VERSION=local
      - DEBUG=true
      - SECRET_KEY=abc123
      - NPM_DEVELOP_COMMAND=dev
      - COOKIE_DOMAIN=localhost
      - CSP_STYLE_SRC=p.typekit.net,use.typekit.net
      - CSP_FONT_SRC=use.typekit.net
      - SESSION_REDIS_URL=redis://redis:6379/0
      - SQLALCHEMY_DATABASE_URI=postgresql://postgres:postgres@db:5432/postgres
      - CACHE_TYPE=RedisCache
      - CACHE_REDIS_URL=redis://redis:6379/1
      - GA4_ID=GTM-T8DSWV
      - SESSION_COOKIE_SECURE=False
      - S3_ENDPOINT=http://s3:9000
      - AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE
      - AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      - PROOF_OF_DEATH_BUCKET_NAME=${PROOF_OF_DEATH_BUCKET_NAME:-proof-of-death}
    env_file:
      - path: .env
        required: false
    ports:
      - 65517:8080
    volumes:
      - ./:/app
      - ~/.aws:/home/app/.aws
    depends_on:
      - db
      - redis
      - mock-record-copying-service-api
      - s3
    healthcheck:
      start_period: 10s
      start_interval: 2s

  db:
    image: postgres:16.0
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    ports:
      - 65502:8080

  mock-record-copying-service-api:
    image: wiremock/wiremock:3.13.2
    volumes:
      - ./wiremock:/home/wiremock
    ports:
      - 65498:8080

  s3:
    image: scireum/s3-ninja
    ports:
      - 65504:9000
    volumes:
      - s3data:/home/sirius/data

  docs:
    image: squidfunk/mkdocs-material
    volumes:
      - .:/docs
    ports:
      - 65518:8000

  redis:
    image: redis:latest
    volumes:
      - redis:/data

volumes:
  redis:
  pgdata:
  s3data:
